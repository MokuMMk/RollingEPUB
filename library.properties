name=RollingEPUB
version=1.0.0
author=RollingEPUB contributors
maintainer=RollingEPUB contributors
sentence=A portable EPUB parsing, layout and rendering library with footnotes, images, zoom and CJK support.
paragraph=Open EPUB 2/3 books, parse OPF/NCX/NAV/HTML/CSS, paginate CJK and Latin text (optional vertical writing and hyphenation), decode images, render pages into any 1/2/4/8-bit framebuffer, and expose footnote popups and an image zoom viewer. C API plus a header-only C++ facade. Feature flags let small devices drop TTF, images, vertical text and more.
category=Data Processing
url=https://example.invalid/rollingepub
architectures=*
includes=rolling_epub/repub.h
